<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery - AVM'26</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<nav><ul><li><a href="index.html#about">About</a></li><li><a href="index.html#participation">Participation</a></li><li><a href="program.html">Program</a></li><li><a href="index.html#venue">Venue</a></li><li><a href="index.html#registration">Registration</a></li><li><a href="gallery.html">Photos</a></li></ul></nav>
<header class="page-header">
<div class="container">
<a class="back-link" href="index.html">&larr; Back to home</a>
<h1>Photo Gallery</h1>
<p class="subtitle">Moments from AVM'26 &middot; Eger, Hungary</p>
</div>
</header>
<main>
<section class="section">
<div class="container gallery-page">
<div id="gallery" class="gallery-grid" aria-live="polite"></div>
<p id="gallery-empty" class="gallery-empty" hidden>No photos yet - check back soon.</p>
</div>
</section>
</main>

<div id="lightbox" class="lightbox" hidden>
<button class="lightbox-close" type="button" aria-label="Close">&times;</button>
<button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous photo">&#8249;</button>
<img class="lightbox-img" src="" alt="">
<button class="lightbox-nav lightbox-next" type="button" aria-label="Next photo">&#8250;</button>
<div class="lightbox-bar">
<span class="lightbox-counter"></span>
<a class="lightbox-original" href="" target="_blank" rel="noopener">View original &#8599;</a>
</div>
</div>

<footer><div class="container footer-inner"><p>AVM'26 &middot; Alpine Verification Meeting &middot; 22-24 September 2026 &middot; Eger, Hungary</p></div></footer>

<script src="photos/manifest.js"></script>
<script>
(function () {
    var photos = window.GALLERY_PHOTOS || [];
    var grid = document.getElementById('gallery');
    var empty = document.getElementById('gallery-empty');

    if (!photos.length) {
        empty.hidden = false;
        return;
    }

    photos.forEach(function (name, i) {
        var fig = document.createElement('figure');
        fig.className = 'gallery-item';
        fig.tabIndex = 0;
        fig.setAttribute('role', 'button');
        fig.setAttribute('aria-label', 'Open photo ' + (i + 1) + ' of ' + photos.length);
        var img = document.createElement('img');
        img.src = 'photos/' + name;
        img.alt = "AVM'26 photo " + (i + 1);
        img.loading = 'lazy';
        img.decoding = 'async';
        fig.appendChild(img);
        fig.addEventListener('click', function () { open(i); });
        fig.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); }
        });
        grid.appendChild(fig);
    });

    var lb = document.getElementById('lightbox');
    var lbImg = lb.querySelector('.lightbox-img');
    var counter = lb.querySelector('.lightbox-counter');
    var original = lb.querySelector('.lightbox-original');
    var current = 0;

    function render() {
        lbImg.src = 'photos/' + photos[current];
        lbImg.alt = "AVM'26 photo " + (current + 1);
        counter.textContent = (current + 1) + ' / ' + photos.length;
        original.href = 'photos/' + photos[current];
    }
    function open(i) {
        current = i;
        render();
        lb.hidden = false;
        document.body.style.overflow = 'hidden';
    }
    function close() {
        lb.hidden = true;
        document.body.style.overflow = '';
    }
    function next() { current = (current + 1) % photos.length; render(); }
    function prev() { current = (current - 1 + photos.length) % photos.length; render(); }

    lb.querySelector('.lightbox-close').addEventListener('click', close);
    lb.querySelector('.lightbox-next').addEventListener('click', function (e) { e.stopPropagation(); next(); });
    lb.querySelector('.lightbox-prev').addEventListener('click', function (e) { e.stopPropagation(); prev(); });
    lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
    document.addEventListener('keydown', function (e) {
        if (lb.hidden) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowRight') next();
        else if (e.key === 'ArrowLeft') prev();
    });
})();
</script>
</body>
</html>
